<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Calculator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 400px;
        margin: 60px auto;
      }
      input,
      select,
      button {
        width: 100%;
        padding: 8px;
        margin: 6px 0;
        font-size: 16px;
        box-sizing: border-box;
      }
      button {
        cursor: pointer;
      }
      #result {
        margin-top: 20px;
        padding: 12px;
        background: #f0f0f0;
        border-radius: 6px;
        white-space: pre-wrap;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <h2>Calculator</h2>
    <input type="number" id="num1" placeholder="Number 1" value="0" />
    <input
      type="number"
      id="num2"
      placeholder="Number 2 (ignored for square root)"
      value="0"
    />
    <select id="operation">
      <option value="add">Add</option>
      <option value="subtract">Subtract</option>
      <option value="multiply">Multiply</option>
      <option value="divide">Divide</option>
      <option value="modulo">Modulo</option>
      <option value="power">Power</option>
      <option value="square_root">Square Root</option>
    </select>
    <button onclick="calculate()">Calculate</button>
    <div id="result"></div>

    <script>
      document
        .getElementById("calcForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const num1 = parseFloat(document.getElementById("num1").value);
          const num2 = parseFloat(document.getElementById("num2").value);
          const operation = document.getElementById("operation").value;

          const symbols = {
            add: "+",
            subtract: "-",
            multiply: "×",
            divide: "÷",
            modulo: "%",
            power: "^",
          };

          try {
            const res = await fetch("/calculate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ num1, num2, operation }),
            });
            const data = await res.json();

            if (!res.ok || data.python_result.status !== "success") {
              document.getElementById("result").textContent =
                `Error: ${data.python_result?.message || "Something went wrong"}`;
            } else {
              const symbol = symbols[operation] || operation;
              document.getElementById("result").textContent =
                `${num1} ${symbol} ${num2} = ${data.python_result.result}`;
            }
          } catch (err) {
            document.getElementById("result").textContent =
              "Error: could not reach server";
          }
        });
    </script>
  </body>
</html>
